[workspace]
members = [".", "crates/iptools-wasm"]
resolver = "2"

[package]
name = "iptools"
version = "0.5.0"
authors = ["Denis Avvakumov"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Deniskore/iptools"
homepage = "https://github.com/Deniskore"
exclude = ["/.vscode"]
description = """
High-performance IPv4/IPv6 utilities and iterators inspired by Python's iptools
"""
keywords = ["ip", "iptools", "network"]
categories = ["algorithms", "network-programming"]
edition = "2024"
rust-version = "1.85.0"

[features]
default = ["std"]
std = ["dep:lazy-regex"]
serde = ["dep:serde"]

[dependencies]
lazy-regex = { version = "3.6.0", optional = true }
serde = { version = "1", default-features = false, features = [
    "derive",
    "alloc",
], optional = true }

[dev-dependencies]
pretty_assertions = "1.4.1"
divan = "0.1"
ipnet = "2.12.0"
ipnetwork = "0.21.1"
serde_json = "1"

[profile.release]
opt-level = 3

[[bench]]
name = "ip_bench"
harness = false
