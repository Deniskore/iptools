[package]
name = "iptools"
version = "0.4.0"
authors = ["Denis Avvakumov"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Deniskore/iptools"
homepage = "https://github.com/Deniskore"
description = """
High-performance IPv4/IPv6 utilities and iterators inspired by Python's iptools
"""
keywords = ["ip", "iptools", "network"]
categories = ["algorithms", "network-programming"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = ["once_cell/std"]
serde = ["dep:serde"]

[dependencies]
lazy-regex = "3.4.2"
once_cell = { version = "1.21", default-features = false, features = ["alloc"] }
tinyvec = { version = "1", features = ["alloc"] }
itoa = { version = "1", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
pretty_assertions = "1.4.1"
divan = "0.1"
ipnet = "2.11.0"
ipnetwork = "0.21.1"
serde_json = "1"

[profile.release]
opt-level = 3

[[bench]]
name = "ip_bench"
harness = false
